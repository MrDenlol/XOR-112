name: Desktop builds
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxrandr-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: xor-112-${{ matrix.os }}
          path: |
            target/release/xor-112.exe
            target/release/xor-112
          if-no-files-found: error
      - name: Export and package Windows examples
        if: runner.os == 'Windows'
        run: |
          cargo run --release --locked --example export_examples
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package_windows.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: xor-112-windows-package
          path: dist/*
          if-no-files-found: error
  release:
    name: Publish first release or version tag
    needs: build
    if: github.event_name != 'pull_request' && github.repository == 'MrDenlol/XOR-112'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xor-112-windows-package
          path: dist
      - name: Publish a new version only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          TAG="v$VERSION"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Tag does not match Cargo.toml" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving its assets unchanged."
            exit 0
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "XOR-112 $VERSION" --notes-file docs/RELEASE_NOTES.md
